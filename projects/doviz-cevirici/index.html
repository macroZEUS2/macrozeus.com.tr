<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png"
          data-macrozeus="/doviz-cevirici.png"
          data-other="/1doviz-cevirici.png"
          href="/doviz-cevirici.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Döviz Çevirici</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script>
        (function() {
            function applyFavicon() {
                var theme = localStorage.getItem('macroTheme') || 'macrozeus';
                var favicon = document.querySelector('link[rel="icon"]');
                if (!favicon) return;
                favicon.href = theme === 'macrozeus'
                    ? favicon.getAttribute('data-macrozeus')
                    : favicon.getAttribute('data-other');
            }
            applyFavicon();
            window.addEventListener('storage', function(e) {
                if (e.key === 'macroTheme') applyFavicon();
            });
        })();
    </script>
</head>
<body>
    <a href="/#projects" class="back-to-home">
        <i class='bx bx-arrow-back'></i>
    </a>
    <div class="container">
        <h1 class="title">Döviz Çevirici</h1>
        <div class="converter">
            <div class="input-group">
                <label for="amount">Miktar</label>
                <input type="number" id="amount" placeholder="Miktarı Girin" min="0" step="0.01" required>
            </div>
            <div class="input-group">
                <label for="baseCurrency">Temel Para Birimi</label>
                <select id="baseCurrency"></select>
            </div>
            <div class="input-group">
                <label for="targetCurrency">Hedef Para Birimi</label>
                <select id="targetCurrency"></select>
            </div>
            <button id="convertBtn">Dönüştür</button>
        </div>
        <div class="result">
            <p id="conversionResult"></p>
        </div>
    </div>

    <div class="attribute">
        Create by
        <a href="https://www.instagram.com/muhammetalialc">
            Muhammet Ali Alçı
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
