<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png"
          data-macrozeus="/dijital-saat.png"
          data-other="/1dijital-saat.png"
          href="/dijital-saat.png">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Saat</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script>
        // Tema değişince favicon güncelle
        (function() {
            function applyFavicon() {
                var theme = localStorage.getItem('macroTheme') || 'macrozeus';
                var favicon = document.querySelector('link[rel="icon"]');
                if (!favicon) return;
                favicon.href = theme === 'macrozeus'
                    ? favicon.getAttribute('data-macrozeus')
                    : favicon.getAttribute('data-other');
            }
            applyFavicon();
            window.addEventListener('storage', function(e) {
                if (e.key === 'macroTheme') applyFavicon();
            });
        })();
    </script>
</head>
<body>
    <a href="/#projects" class="back-to-home">
        <i class='bx bx-arrow-back'></i>
    </a>
    <div class="container">
        <div class="date"></div>
        <div class="clock">
            <div class="time"></div>
        </div>
    </div>

    <div class="attribute">
        Create by
        <a href="https://www.instagram.com/muhammetalialc">
            Muhammet Ali Alçı
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
