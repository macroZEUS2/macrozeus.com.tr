<html lang="tr">
  <head>
    <meta charset="utf-8">
    <title>Şifre Oluşturucu</title>
    <link rel="stylesheet" href="../dist/style.css">
    <script src="../dist/script.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  </head>
  <body>
    <a href="index.html" class="back-to-home">
        <i class='bx bx-arrow-back'></i>
    </a>
    <div class="container">
      <h2>Şifre Oluşturucu</h2>
      <div class="wrapper">
        <div class="input-box">
          <input type="text" disabled>
          <span class="material-symbols-rounded">copy_all</span>
        </div>
        <div class="pass-indicator"></div>
        <div class="pass-length">
          <div class="details">
            <label class="title">Şifre Uzunluğu</label>
            <span></span>
          </div>
          <input type="range" min="1" max="30" value="15" step="1">
        </div>
        <div class="pass-settings">
          <label class="title">Şifre Ayarları</label>
          <ul class="options">
            <li class="option">
              <input type="checkbox" id="lowercase" checked>
              <label for="lowercase">Küçük Harfler (a-z)</label>
            </li>
            <li class="option">
              <input type="checkbox" id="uppercase">
              <label for="uppercase">Büyük Harfler (A-Z)</label>
            </li>
            <li class="option">
              <input type="checkbox" id="numbers">
              <label for="numbers">Sayılar (0-9)</label>
            </li>
            <li class="option">
              <input type="checkbox" id="symbols">
              <label for="symbols">Semboller (!-$^+)</label>
            </li>
          </ul>
        </div>
        <button class="generate-btn">Oluştur</button>
      </div>
    </div>
    
    <div class="attribute">
        Create by 
        <a href="https://www.instagram.com/muhammetalialc">
            Muhammet Ali Alçı
        </a>
    </div>
    
    <script src="script.js" defer></script>
  </body>
</html>
