<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png"
          data-macrozeus="/sifre-olusturucu.png"
          data-other="/1sifre-olusturucu.png"
          href="/sifre-olusturucu.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Oluşturucu</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="/#projects" class="back-to-home" aria-label="Ana sayfaya dön">
        <i class='bx bx-arrow-back'></i>
    </a>
    <main class="container">
        <h2>Şifre Oluşturucu</h2>
        <div class="wrapper">
            <div class="input-box">
                <input type="text" readonly aria-label="Oluşturulan şifre">
                <span class="material-symbols-rounded" role="button" tabindex="0" aria-label="Şifreyi kopyala">copy_all</span>
            </div>
            <div class="pass-indicator" aria-hidden="true"></div>
            <div class="pass-length">
                <div class="details">
                    <label class="title" for="length">Şifre Uzunluğu</label>
                    <span></span>
                </div>
                <input type="range" id="length" min="4" max="30" value="15" step="1">
            </div>
            <div class="pass-settings">
                <p class="title">Şifre Ayarları</p>
                <ul class="options">
                    <li class="option">
                        <input type="checkbox" id="lowercase" checked>
                        <label for="lowercase">Küçük Harfler (a-z)</label>
                    </li>
                    <li class="option">
                        <input type="checkbox" id="uppercase" checked>
                        <label for="uppercase">Büyük Harfler (A-Z)</label>
                    </li>
                    <li class="option">
                        <input type="checkbox" id="numbers" checked>
                        <label for="numbers">Sayılar (0-9)</label>
                    </li>
                    <li class="option">
                        <input type="checkbox" id="symbols">
                        <label for="symbols">Semboller (!@#$%)</label>
                    </li>
                </ul>
            </div>
            <button class="generate-btn">Oluştur</button>
        </div>
    </main>
    <footer class="attribute">
        Created by
        <a href="https://www.instagram.com/muhammetalialc">Muhammet Ali Alçı</a>
    </footer>
    <script src="../../dist/theme.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
