<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Kod Oluşturucu</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <!-- BACK FIX -->
    <a href="../../index.html" class="back-to-home">
        <i class='bx bx-arrow-back'></i>
    </a>

    <div class="wrapper">
        <header>
            <h1>QR Kod Oluşturucu</h1>
            <p>Metin veya URL girerek QR oluştur</p>
        </header>

        <div class="form">
            <input type="text" placeholder="URL veya metin">
            <button>QR Kod Oluştur</button>
        </div>

        <div class="qr-code">
            <img src="" alt="qr">
        </div>
    </div>

    <div class="attribute">
        Created by <a href="https://github.com/macroZEUS2" target="_blank">macroZEUS</a>
    </div>

    <script src="script.js"></script>
